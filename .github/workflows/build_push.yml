name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ProChan Extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      # تفعيل ميزة الكاش لتسريع البناء بشكل ملحوظ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spotless Apply
        run: |
          ./gradlew spotlessApply

      # بناء الإضافة كنسخة مخصصة للمطورين (بدون توقيع)
      - name: Build ProChan
        run: |
          ./gradlew :src:ar:procomic:assembleDebug

      # رفع ملف الـ APK لتتمكن من تحميله مباشرة من GitHub Actions
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "ProChan-APK"
          path: "**/*.apk"
          retention-days: 3
